# Overlay on the complete local development stack (scripts/demo).
# Cloudflare route: demo.bss-cli.com -> http://demo-gateway:8000
services:
  portal-self-serve:
    environment:
      BSS_PORTAL_PUBLIC_URL: ${BSS_PORTAL_PUBLIC_URL:-https://demo.bss-cli.com}
      BSS_PORTAL_DEV_INSECURE_COOKIE: "0"
  demo-gateway:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports: ["127.0.0.1:9080:8000"]
    volumes:
      - ./deploy/demo/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [bss]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      portal-self-serve: {condition: service_healthy}
      payment: {condition: service_healthy}
  cloudflared:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    restart: unless-stopped
    user: "${BSS_DEV_UID:-1000}:${BSS_DEV_GID:-1000}"
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare-tunnel-token"]
    volumes:
      - type: bind
        source: ./.secrets/cloudflare-tunnel-token
        target: /run/secrets/cloudflare-tunnel-token
        read_only: true
        bind:
          create_host_path: false
    networks: [bss]
    depends_on:
      demo-gateway: {condition: service_healthy}
